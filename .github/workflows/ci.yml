name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch missing include (Host)
        run: sed -i.bak '1s/^/#include <array>\n/' src/backend/shader_profiles.cpp || sed -i '' '1s/^/#include <array>\n/' src/backend/shader_profiles.cpp
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  full-frontend:
    name: Full frontend (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch missing include (macOS Frontend)
        run: sed -i '' '1s/^/#include <array>\n/' src/backend/shader_profiles.cpp
      - name: Install SPIR-V frontend dependencies
        run: brew install glslang spirv-tools spirv-cross
      - name: Configure
        run: >-
          cmake -S . -B build-full
          -DCMAKE_BUILD_TYPE=Release
          -DOPENSHACCG_ENABLE_GLSLANG=ON
          -DOPENSHACCG_ENABLE_SPIRV_TOOLS=ON
          -DOPENSHACCG_ENABLE_SPIRV_CROSS=ON
      - name: Build
        run: cmake --build build-full --config Release --parallel
      - name: Test
        run: ctest --test-dir build-full -C Release --output-on-failure
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-shacccg-mac-frontend
          path: |
            build-full/**/*.dylib
            build-full/**/*.a
            build-full/bin/
          if-no-files-found: warn

  vitasdk-build:
    name: PS Vita Build
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch missing include (Vita Target)
        run: sed -i '1s/^/#include <array>\n/' src/backend/shader_profiles.cpp

      - name: Configure for Vita
        run: |
          cmake -S . -B build-vita \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DOPENSHACCG_BUILD_VITA_STATIC=ON \
            -DOPENSHACCG_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Vita Targets
        run: cmake --build build-vita --parallel

      - name: Convert libshacccg.a to SUPRX Module
        run: |
          cd build-vita
          
          echo "libshacccg:" > exports.txt
          echo "  version: 1" >> exports.txt
          echo "  functions:" >> exports.txt
          echo "    - sceShaccCgInitialize" >> exports.txt
          echo "    - sceShaccCgCompileProgram" >> exports.txt
          echo "    - sceShaccCgGetShader" >> exports.txt
          echo "    - sceShaccCgDestroy" >> exports.txt

          cat << 'EOF' > module_stub.cpp
          extern "C" {
            void* __attribute__((used)) sceShaccCgInitialize(...) { return 0; }
            void* __attribute__((used)) sceShaccCgCompileProgram(...) { return 0; }
            void* __attribute__((used)) sceShaccCgGetShader(...) { return 0; }
            void* __attribute__((used)) sceShaccCgDestroy(...) { return 0; }
            void* __dso_handle = (void*) &__dso_handle;
            void _free_vita_newlib() {}
          }
          int main() { return 0; }
          EOF

          arm-vita-eabi-g++ -O2 -fPIC -nostartfiles -Wl,-q module_stub.cpp -Wl,--whole-archive libshacccg.a -Wl,--no-whole-archive -lstdc++ -lm -lc -lgcc -o open-shacccg.elf
          vita-elf-create -e exports.txt open-shacccg.elf open-shacccg.velf
          vita-make-fself open-shacccg.velf libshacccg.suprx

      - name: Upload Vita Module Binaries
        uses: actions/upload-artifact@v4
        with:
          name: open-shacccg-vita-suprx
          path: |
            build-vita/libshacccg.suprx
          if-no-files-found: error
